<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="index.css">

</head>

<body>
    <div class="Intro"></div>
    
    <input type="text" id="display" readonly placeholder="0">
    <div class="buttons">
        <button class="btn" id="add" onclick="Number('+')">+</button>
        <button class="btn" id="7" onclick="Number('7')">7</button>
        <button class="btn" id="8" onclick="Number('8')">8</button>
        <button class="btn" id="9" onclick="Number('9')">9</button>
        <button class="btn" id="subtract" onclick="Number('-')">-</button>
        <button class="btn"id="4" onclick="Number('4')">4</button>
        <button class="btn" id="5" onclick="Number('5')">5</button>
        <button class="btn"id="6" onclick="Number('6')">6</button>
        <button class="btn" id="multiply" onclick="Number('*')">*</button>
        <button class="btn" id="1" onclick="Number('1')">1</button>
        <button class="btn" id="2" onclick="Number('2')">2</button>
        <button class="btn" id="3" onclick="Number('3')">3</button>
        <button class="btn" id="divide" onclick="Number('/')">/</button>
        <button class="btn" id="0" onclick="Number('0')">0</button>
        <button class="btn" id="decimal" onclick="Number('.')">.</button>
        <button class="btn" id="equal" onclick="Calculate()">=</button>
        <button class="btn" id="clear" onclick="Clear()">C</button>
        
    </div>
</body>
    <script src="index.js"></script>
</html>
